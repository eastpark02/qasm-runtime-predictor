[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-circuit-visualizer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "qiskit[qasm3-import]>=2.2,<3", "qiskit-aer==0.18.2",
  "numpy>=2,<3", "scipy>=1.14,<2", "joblib>=1.4,<2", "scikit-learn>=1.6,<2",
  "threadpoolctl>=3.6,<4", "shap>=0.49,<1",
  "qbraid==0.11.1", "qbraid-core==0.2.3"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
